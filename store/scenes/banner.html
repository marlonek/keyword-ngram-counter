<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 220px; height: 140px; overflow: hidden; }
body { font-family: Arial, "Segoe UI", Roboto, sans-serif; background: #1a73e8;
  color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 12px; }
.icon { width: 40px; height: 40px; position: relative; margin-bottom: 9px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.icon .bar { width: 7px; background: #fff; border-radius: 1px; }
.b1 { height: 30px; } .b2 { height: 22px; } .b3 { height: 14px; }
.base { position: absolute; bottom: -4px; left: 0; width: 40px; height: 3px; background: #fff; border-radius: 1px; }
h1 { font-size: 15px; font-weight: 700; line-height: 1.15; }
p { font-size: 10px; margin-top: 5px; color: #d7e3fb; }
</style>
</head>
<body>
  <div class="icon"><span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span><span class="base"></span></div>
  <h1>Keyword n-gram counter</h1>
  <p>Repeated 1–5 word phrases</p>
</body>
</html>
