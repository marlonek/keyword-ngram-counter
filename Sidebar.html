<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 13px; margin: 0; padding: 12px; color: #202124; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: #5f6368; margin: 0 0 12px; font-size: 12px; }
  label { display: block; margin: 8px 0 3px; font-weight: bold; }
  textarea, input[type=number] { width: 100%; box-sizing: border-box; padding: 6px; font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .chk { font-weight: normal; display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; }
  .sizes label { display: inline-flex; gap: 3px; margin-right: 10px; font-weight: normal; }
  button { margin-top: 12px; padding: 8px 14px; background: #1a73e8; color: #fff; border: 0; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .6; cursor: default; }
  .hint { background: #f1f3f4; border-radius: 4px; padding: 8px; color: #3c4043; font-size: 12px; }
  .tabs { margin-top: 12px; border-bottom: 1px solid #eee; }
  .tab { display: inline-block; padding: 5px 8px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { border-color: #1a73e8; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid #eee; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .muted { color: #5f6368; }
  .err { color: #d93025; margin-top: 8px; }
  .mode-range { display: none; }
</style>
</head>
<body>
  <h2>Keyword n-gram counter</h2>
  <p class="sub">Find repeated 1–5 word phrases in your text.</p>

  <div class="row">
    <label class="chk"><input type="radio" name="mode" value="text" checked onchange="toggleMode()"> Paste text</label>
    <label class="chk"><input type="radio" name="mode" value="range" onchange="toggleMode()"> Selected cells</label>
  </div>

  <div class="mode-text">
    <label>Text</label>
    <textarea id="text" rows="7" placeholder="Paste your content here…"></textarea>
  </div>

  <div class="mode-range">
    <div class="hint">Select the cells you want to analyze in the sheet, then click <b>Analyze</b>. All selected cells are combined into one text.</div>
  </div>

  <label>Phrase lengths (words)</label>
  <div class="sizes">
    <label><input type="checkbox" class="size" value="1" checked> 1</label>
    <label><input type="checkbox" class="size" value="2" checked> 2</label>
    <label><input type="checkbox" class="size" value="3" checked> 3</label>
    <label><input type="checkbox" class="size" value="4"> 4</label>
    <label><input type="checkbox" class="size" value="5"> 5</label>
  </div>

  <div class="row">
    <div style="flex: 1; min-width: 110px;">
      <label>Min. count</label>
      <input type="number" id="minCount" value="2" min="1">
    </div>
    <div style="flex: 1; min-width: 150px;">
      <label>&nbsp;</label>
      <label class="chk"><input type="checkbox" id="removeStop"> ignore stop-words</label>
    </div>
  </div>

  <label class="chk" style="margin-top: 6px;"><input type="checkbox" id="write" checked> write full results to a new sheet</label>

  <button id="run" onclick="run()">Analyze</button>

  <div id="error" class="err"></div>
  <div id="meta" class="muted" style="margin-top: 10px;"></div>
  <div id="tabs" class="tabs"></div>
  <div id="results"></div>

<script>
  function toggleMode() {
    var isRange = document.querySelector('input[name=mode]:checked').value === 'range';
    document.querySelector('.mode-range').style.display = isRange ? 'block' : 'none';
    document.querySelector('.mode-text').style.display = isRange ? 'none' : 'block';
  }

  function run() {
    var mode = document.querySelector('input[name=mode]:checked').value;
    var sizes = Array.prototype.map.call(document.querySelectorAll('.size:checked'), function (c) { return +c.value; });
    if (!sizes.length) { showErr('Pick at least one phrase length.'); return; }

    var params = {
      mode: mode,
      text: document.getElementById('text').value,
      sizes: sizes,
      removeStop: document.getElementById('removeStop').checked,
      minCount: +document.getElementById('minCount').value || 2,
      write: document.getElementById('write').checked
    };

    showErr('');
    var btn = document.getElementById('run');
    btn.disabled = true; btn.textContent = 'Analyzing…';
    google.script.run
      .withSuccessHandler(function (res) { btn.disabled = false; btn.textContent = 'Analyze'; render(res, sizes); })
      .withFailureHandler(function (e) { btn.disabled = false; btn.textContent = 'Analyze'; showErr(e.message || e); })
      .analyze(params);
  }

  function showErr(m) { document.getElementById('error').textContent = m; }

  function render(res, sizes) {
    document.getElementById('meta').textContent = 'Total words: ' + res.totalWords;
    window._res = res;
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    sizes.forEach(function (n, i) {
      var t = document.createElement('span');
      t.className = 'tab' + (i === 0 ? ' active' : '');
      t.textContent = n + '-word';
      t.onclick = function () { showTab(n, t); };
      tabs.appendChild(t);
    });
    if (sizes.length) showTab(sizes[0], tabs.firstChild);
  }

  function showTab(n, el) {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.remove('active'); });
    if (el) el.classList.add('active');
    var rows = (window._res.sizes[n] || []);
    var html = '<table><tr><th>phrase</th><th class="num">count</th><th class="num">%</th></tr>';
    if (!rows.length) html += '<tr><td colspan="3" class="muted">none above threshold</td></tr>';
    rows.forEach(function (r) {
      html += '<tr><td>' + escapeHtml(r.phrase) + '</td><td class="num">' + r.count +
        '</td><td class="num">' + (Math.round(r.pct * 100) / 100) + '</td></tr>';
    });
    html += '</table>';
    document.getElementById('results').innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
</script>
</body>
</html>
